<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Total Expense</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #0f172a;
            padding: 20px;
        }

        .expense-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 35px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .title {
            color: #0f172a;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .month-box {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .month-label {
            display: block;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .month {
            color: #0f172a;
            font-size: 20px;
            font-weight: bold;
        }

        .total-box {
            background: #7c3aed;
            color: #ffffff;
            padding: 22px;
            border-radius: 12px;
        }

        .total-label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            opacity: 0.9;
        }

        .total {
            font-size: 32px;
            font-weight: bold;
        }

        .footer {
            margin-top: 20px;
            color: #94a3b8;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="expense-card">

        <div class="title">
            Expense Summary
        </div>

        <div class="month-box">
            <span class="month-label">Selected Month</span>
            <div class="month">{{month}}</div>
        </div>

        <div class="total-box">
            <span class="total-label">Total Expense</span>
            <div class="total">₹{{TotalExpense}}</div>
        </div>

        <div class="footer">
            Python • Django • Expense Tracker
        </div>

    </div>

</body>
</html>
